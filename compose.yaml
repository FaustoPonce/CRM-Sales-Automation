services:
  lead-validator:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-sales-automation-lead-validator:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
